<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Registro de la persona Usuaria</title>
        <link rel="stylesheet" href="css.css">
    </head>
    <body>
        <main>
            <form id="formulario-registro" class="formulario">
                
                <!-- SECCIÓN 1: Encabezado superior -->
                <div class="encabezado">
                    <h1>Registro de la persona Usuaria</h1>
                </div>

                <!-- SECCIÓN 2: Campos de texto principales -->
                <div class="seccion-datos">
                    <div class="campo">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre">
                    </div>

                    <div class="campo">
                        <label for="apellido">Apellido:</label>
                        <input type="text" id="apellido" name="apellido">
                    </div>

                    <div class="campo">
                        <label for="correo">Correo Electrónico:</label>
                        <input type="email" id="correo" name="correo">
                    </div>

                    <div class="campo">
                        <label for="contrasena">Contraseña:</label>
                        <input type="password" id="contrasena" name="contrasena">
                    </div>

                    <div class="campo">
                        <label for="descripcion">Breve descripción sobre ti:</label>
                        <textarea id="descripcion" name="descripcion" rows="4"></textarea>
                    </div>
                </div>

                <!-- SECCIÓN 3: Opciones de selección -->
                <fieldset class="intereses">
                    <legend>Intereses:</legend>

                    <label for="tecnologia">
                        <input type="checkbox" id="tecnologia" name="intereses" value="tecnologia">
                        Tecnología
                    </label>

                    <label for="arte">
                        <input type="checkbox" id="arte" name="intereses" value="arte">
                        Arte
                    </label>

                    <label for="deporte">
                        <input type="checkbox" id="deporte" name="intereses" value="deporte">
                        Deporte
                    </label>
                </fieldset>

                <!-- SECCIÓN 4: Acción principal -->
                <div class="boton-contenedor">
                    <button type="submit">Registrarse</button>
                </div>
            </form>
        </main>
    </body>
</html>
